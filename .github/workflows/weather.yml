name: Daily Weather Notification

on:
  schedule:
    # 每天早上8点(UTC)发送天气信息
    - cron: "0 8 * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  send-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Send Weather Notification
        uses: peterWang123589/gaode-weather-notifier-action@v1.0.1
        with:
          # 天气API配置
          amap_api_key: "31097668d593e70f164137f7eb1664f7"

          # 城市配置
          city: "331081"

          # 邮件服务器配置
          smtp_host: "smtp.qq.com"
          smtp_port: "465"
          smtp_user: "a123589zhezhe@163.com"
          smtp_pass: "YZuCJwFpDHducp7s"

          # 收件人邮箱
          recipient_emails: "1546115232@qq.com"

          # 可选配置
          sender_name: "天气助手"
          email_subject: "今日天气预报 🌤️"
